name: Beta Release

# Three ways to start a beta build (see FORK.md, "Releasing a build"):
#   1. Push a change to .github/beta-version on dev. The file holds the
#      version; the workflow creates the tag and the prerelease.
#   2. Run this workflow by hand (Actions tab) and type the version.
#   3. Push an x.y.z-beta.N tag, as upstream does.
on:
    push:
        tags:
            - "*-beta.*"
        branches:
            - dev
        paths:
            - .github/beta-version
    workflow_dispatch:
        inputs:
            version:
                description: "Beta version to build from dev, e.g. 1.7.1-beta.2"
                required: true
                type: string

concurrency:
    group: zotflow-beta-release
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v4
              with:
                  # A manual run always builds dev, whatever branch the button
                  # was pressed on. Pushes build the pushed commit.
                  ref: ${{ github.event_name == 'workflow_dispatch' && 'dev' || '' }}
                  fetch-depth: 0
                  submodules: recursive

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Resolve beta version
              id: version
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  REF_TYPE: ${{ github.ref_type }}
                  REF_NAME: ${{ github.ref_name }}
                  INPUT_VERSION: ${{ inputs.version }}
              run: |
                  if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
                    version="$INPUT_VERSION"
                    from_tag=false
                  elif [ "$REF_TYPE" = "tag" ]; then
                    version="$REF_NAME"
                    from_tag=true
                  else
                    version="$(tr -d '[:space:]' < .github/beta-version)"
                    from_tag=false
                  fi
                  if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
                    echo "Beta versions must use x.y.z-beta.N, received '$version'" >&2
                    exit 1
                  fi
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "from_tag=$from_tag" >> "$GITHUB_OUTPUT"

            - name: Verify beta source
              id: source
              env:
                  RELEASE_VERSION: ${{ steps.version.outputs.version }}
                  FROM_TAG: ${{ steps.version.outputs.from_tag }}
              run: |
                  git fetch origin dev:refs/remotes/origin/dev
                  source_sha="$(git rev-parse HEAD)"
                  if ! git merge-base --is-ancestor "$source_sha" refs/remotes/origin/dev; then
                    echo "A beta must be built from a commit contained in origin/dev" >&2
                    exit 1
                  fi
                  if [ "$FROM_TAG" != "true" ]; then
                    # The tag is created with the release below. A published
                    # beta tag is never moved or reused: an existing tag is
                    # accepted only if it already points at this commit.
                    existing="$(git ls-remote --tags origin \
                      "refs/tags/$RELEASE_VERSION" "refs/tags/$RELEASE_VERSION^{}" |
                      tail -n 1 | cut -f1)"
                    if [ -n "$existing" ] && [ "$existing" != "$source_sha" ]; then
                      echo "Tag $RELEASE_VERSION already exists on another commit ($existing); use the next beta number" >&2
                      exit 1
                    fi
                  fi
                  echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

            - name: Install dependencies
              run: npm ci

            - name: Test source
              run: npm test

            - name: Prepare beta version
              env:
                  RELEASE_VERSION: ${{ steps.version.outputs.version }}
              run: |
                  node scripts/release-version.mjs prepare \
                    --version "$RELEASE_VERSION" \
                    --channel beta
                  node scripts/release-version.mjs verify \
                    --version "$RELEASE_VERSION" \
                    --channel beta

            - name: Build plugin
              run: npm run build:ci

            - name: Verify release assets
              env:
                  RELEASE_VERSION: ${{ steps.version.outputs.version }}
              run: |
                  test -s main.js
                  test -s manifest.json
                  test -s styles.css
                  node scripts/release-version.mjs verify \
                    --version "$RELEASE_VERSION" \
                    --channel beta
                  sha256sum main.js manifest.json styles.css > SHA256SUMS.txt

            - name: Upload workflow artifact
              uses: actions/upload-artifact@v4
              with:
                  name: obsidian-zotflow-${{ steps.version.outputs.version }}
                  path: |
                      main.js
                      manifest.json
                      styles.css
                      SHA256SUMS.txt
                  if-no-files-found: error
                  compression-level: 0

            - name: Create beta release
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_VERSION: ${{ steps.version.outputs.version }}
                  FROM_TAG: ${{ steps.version.outputs.from_tag }}
                  SOURCE_SHA: ${{ steps.source.outputs.sha }}
              run: |
                  if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
                    echo "Release $RELEASE_VERSION already exists; keeping it for an idempotent rerun"
                    exit 0
                  fi
                  notes="$(printf '%s\n\n%s\n\n%s' \
                    "ZotFlow Evo beta built from commit \`$SOURCE_SHA\`." \
                    "Validated with \`npm test\` and \`npm run build:ci\`." \
                    "Install with BRAT pinned to this version or download the attached assets.")"
                  if [ "$FROM_TAG" = "true" ]; then
                    tag_args=(--verify-tag)
                  else
                    # No tag was pushed: the release creates it on the built commit.
                    tag_args=(--target "$SOURCE_SHA")
                  fi
                  gh release create "$RELEASE_VERSION" \
                    "${tag_args[@]}" \
                    --title "$RELEASE_VERSION" \
                    --notes "$notes" \
                    --prerelease \
                    --latest=false \
                    main.js \
                    manifest.json \
                    styles.css \
                    SHA256SUMS.txt
